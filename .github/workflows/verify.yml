name: Test and verify static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install browser-only dependencies without native postinstall scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regression tests
        run: npm test
      - name: Rebuild public site
        run: npm run build
      - name: Ensure site assets are reproducible
        run: git diff --exit-code -- docs/assets
